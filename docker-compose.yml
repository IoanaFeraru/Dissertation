# ============================================================
# Dissertation — Performance Gain of Using a Specialised DB
# All 7 database services with persistent volumes
# Usage:
#   docker-compose up -d        (start all in background)
#   docker-compose down         (stop all, data is preserved)
#   docker-compose down -v      (stop all AND delete all data)
# ============================================================

services:

  # ------------------------------------------------------------
  # 1. PostgreSQL — Relational baseline
  # ------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dissertation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 2. MongoDB — Document store
  # ------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: dissertation_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 3. Redis — Key-Value store
  # ------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: dissertation_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 4. Neo4j — Graph DB
  # ------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: dissertation_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ------------------------------------------------------------
  # 5. Elasticsearch — Full-text search
  # Security disabled for local development simplicity.
  # ------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: dissertation_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------
  # 6. Apache Cassandra — Columnar
  # ------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: dissertation_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: dissertation_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_USER: ${CASSANDRA_USER}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD}
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_AUTHORIZER: CassandraAuthorizer
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------
  # 7. TimescaleDB — Time Series
  # Runs on port 5433 to avoid conflict with main PostgreSQL.
  # ------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dissertation_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_DB: ${TIMESCALE_DB}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================
# Named volumes — data persists across docker-compose restarts
# ============================================================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  elasticsearch_data:
  cassandra_data:
  timescaledb_data: